<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stronzo chi legge">
<title>Stronzo chi legge, in macchina!</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --ink:#f2f4f7; --dim:#8b929b; --faint:#565c65; --hair:rgba(255,255,255,.09);
  --accent:#0a84ff; --good:#30d158; --bad:#ff453a; --warn:#ff9f0a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse 120% 80% at 50% 50%,transparent 40%,rgba(0,0,0,.85) 100%)}

/* ================= HUD ================= */
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:14px;z-index:30;
  width:196px;padding:12px 13px 11px;border-radius:15px;
  background:rgba(18,20,24,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:.5px solid var(--hair);pointer-events:none;
  opacity:0;transform:translateY(-6px);transition:opacity .45s,transform .45s}
#hud.on{opacity:1;transform:none}
.hrow{display:flex;align-items:center;gap:7px}
#led{width:6px;height:6px;border-radius:50%;background:var(--bad);flex:0 0 auto;
  box-shadow:0 0 8px currentColor;color:var(--bad);transition:.25s}
#led.ok{background:var(--good);color:var(--good)}
#st{font-size:10.5px;font-weight:600;color:var(--ink);letter-spacing:.09em}
#hz{font-size:10px;color:var(--faint);margin-left:auto;
  font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
#spark{display:block;width:170px;height:30px;margin:9px 0 3px}
.meta{font-size:8.5px;letter-spacing:.11em;color:#4a5058;text-transform:uppercase}
.grid{margin-top:9px;display:grid;grid-template-columns:auto 1fr;gap:5px 9px;align-items:center}
.k{font-size:8.5px;letter-spacing:.09em;color:#4a5058}
.bar{height:2.5px;background:rgba(255,255,255,.07);border-radius:2px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:50%;width:0;border-radius:2px;background:var(--accent)}
.bar.uni i{left:0}
.bar.uni i.hi{background:var(--warn)}
#nums{margin-top:9px;font-family:ui-monospace,Menlo,monospace;font-size:9.5px;
  line-height:1.55;color:#565c65;white-space:pre;font-variant-numeric:tabular-nums}

/* ================= GATE ================= */
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;padding:36px;text-align:center;z-index:40;
  background:radial-gradient(ellipse 100% 60% at 50% 42%,#0d1218 0%,#000 70%);
  transition:opacity .5s cubic-bezier(.4,0,.2,1),transform .5s cubic-bezier(.4,0,.2,1)}
#gate.out{opacity:0;transform:scale(1.04);pointer-events:none}
#gateCv{position:absolute;inset:0;z-index:-1;opacity:.6}
#gate h1{color:var(--ink);font-size:clamp(26px,7.6vw,35px);font-weight:700;letter-spacing:-.035em;
  line-height:1.1;opacity:0;animation:rise .9s .12s cubic-bezier(.16,1,.3,1) forwards}
#gate .sub{color:var(--dim);font-size:15px;line-height:1.55;max-width:290px;margin-top:16px;
  opacity:0;animation:rise .9s .26s cubic-bezier(.16,1,.3,1) forwards}
#goWrap{margin-top:34px;position:relative;opacity:0;
  animation:rise .9s .4s cubic-bezier(.16,1,.3,1) forwards}
#go{appearance:none;border:none;background:var(--accent);color:#fff;font-size:17px;font-weight:600;
  letter-spacing:-.01em;padding:16px 48px;border-radius:100px;position:relative;z-index:2;
  box-shadow:0 6px 26px rgba(10,132,255,.34);
  transition:transform .18s cubic-bezier(.16,1,.3,1),box-shadow .2s}
#go:active{transform:scale(.945);box-shadow:0 2px 12px rgba(10,132,255,.28)}
#pulse{position:absolute;inset:0;border-radius:100px;border:1px solid rgba(10,132,255,.6);
  animation:halo 2.8s cubic-bezier(.2,.6,.3,1) infinite;pointer-events:none}
@keyframes halo{0%{transform:scale(1);opacity:.6}75%{transform:scale(1.34);opacity:0}100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#warn{color:var(--warn);font-size:13px;line-height:1.5;max-width:320px;margin-top:20px;min-height:0}
.hint{color:#484e56;font-size:11.5px;line-height:1.6;max-width:300px;margin-top:26px;
  opacity:0;animation:rise .9s .56s cubic-bezier(.16,1,.3,1) forwards}
#simu{appearance:none;background:rgba(255,255,255,.05);border:.5px solid var(--hair);
  color:var(--dim);font-size:12.5px;padding:11px 22px;border-radius:100px;
  margin-top:16px;display:none}

/* ================= FOOT ================= */
#foot{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;z-index:30;
  display:flex;justify-content:center;gap:6px;opacity:0;transition:opacity .45s}
#foot.on{opacity:1}
#foot button{appearance:none;background:rgba(20,22,26,.7);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:.5px solid var(--hair);color:#6e757e;
  font-size:9.5px;letter-spacing:.09em;font-weight:600;padding:9px 13px;border-radius:100px;
  transition:color .2s,background .2s}
#foot button:active{background:rgba(255,255,255,.11)}
#foot button.act{color:var(--accent)}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="vig"></div>

<div id="hud">
  <div class="hrow"><span id="led"></span><span id="st">IN ATTESA</span><span id="hz"></span></div>
  <canvas id="spark" width="340" height="60"></canvas>
  <div class="meta" id="skLbl">accelerometro grezzo</div>
  <div class="grid">
    <span class="k">ACC/FRENO</span><div class="bar"><i id="bLong"></i></div>
    <span class="k">CURVA</span><div class="bar"><i id="bLat"></i></div>
    <span class="k">VEICOLO</span><div class="bar uni"><i id="bVeh"></i></div>
    <span class="k">MANO</span><div class="bar uni"><i id="bHand" class="hi"></i></div>
  </div>
  <div id="nums"></div>
</div>

<div id="foot">
  <button id="tHud">HUD</button>
  <button id="tInv">VERSO +</button>
  <button id="tGain">FORZA ×1</button>
  <button id="tFilt">FILTRO</button>
</div>

<div id="gate">
  <canvas id="gateCv"></canvas>
  <h1>Stronzo chi legge,<br>in macchina!</h1>
  <div class="sub">Punti sui bordi guidati dal moto reale del veicolo. Filtro complementare giroscopico: separa l'auto dalla mano.</div>
  <div id="goWrap"><div id="pulse"></div><button id="go">Attiva</button></div>
  <div id="warn"></div>
  <button id="simu">Prova senza sensori</button>
  <div class="hint">Nessuna animazione a tempo. Se i sensori non leggono, i punti restano immobili.</div>
</div>

<script>
(() => {
"use strict";
const $=i=>document.getElementById(i);
const DPR=Math.min(devicePixelRatio||1,2.5);
const RAD=Math.PI/180;

/* ============ GATE AMBIENT (solo schermata iniziale) ============ */
let stopGate=null;
(function(){
  const cv=$('gateCv'),g=cv.getContext('2d');let w,h,ps=[],raf,t=0;
  function sz(){w=cv.clientWidth;h=cv.clientHeight;cv.width=w*DPR;cv.height=h*DPR;
    g.setTransform(DPR,0,0,DPR,0,0);ps=[];
    for(let i=0,n=Math.round(w*h/8000);i<n;i++)
      ps.push({x:Math.random()*w,y:Math.random()*h,r:.7+Math.random()*1.9,
               sp:.10+Math.random()*.42,ph:Math.random()*6.28});}
  function f(){t+=.016;g.clearRect(0,0,w,h);
    for(const p of ps){p.y-=p.sp;if(p.y<-6){p.y=h+6;p.x=Math.random()*w;}
      g.beginPath();g.arc(p.x+Math.sin(t*.5+p.ph)*8,p.y,p.r,0,6.2832);
      g.fillStyle='rgba(122,158,205,'+(.12+.24*(.5+.5*Math.sin(t*.85+p.ph))).toFixed(3)+')';g.fill();}
    raf=requestAnimationFrame(f);}
  sz();f();addEventListener('resize',sz);stopGate=()=>cancelAnimationFrame(raf);
})();

/* ============ SPRITE punto con alone ============ */
const SP=document.createElement('canvas');SP.width=SP.height=64;
(function(){const g=SP.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(228,238,252,1)');
  gr.addColorStop(.34,'rgba(196,214,238,.92)');
  gr.addColorStop(.55,'rgba(140,170,215,.30)');
  gr.addColorStop(1,'rgba(120,150,200,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);})();

/* ============ CAMPO ============ */
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,tracks=[];
function build(){
  const m=Math.max(16,Math.min(W,H)*0.044);
  const step=Math.max(34,Math.min(W,H)*0.086);
  const padY=H*0.6,padX=W*0.6;
  tracks=[];
  const V=(x,w)=>{const a=[];for(let y=-padY;y<H+padY;y+=step)a.push({x,y});return{p:a,v:1,w}};
  const Hh=(y,w)=>{const a=[];for(let x=-padX;x<W+padX;x+=step)a.push({x,y});return{p:a,v:0,w}};
  tracks.push(V(m,1),V(W-m,1),V(m+step*.8,.62),V(W-m-step*.8,.62),Hh(m,.78),Hh(H-m,.78));
}
function size(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);build();}
addEventListener('resize',size);

/* ============================================================
   CATENA DI FILTRAGGIO
   Bande misurate: veicolo 0–0.3 Hz | tremore mano 5–12 Hz
   ============================================================ */
const F_VEH = 0.75;   // Hz  passa-basso: tiene l'auto, taglia il tremore
const F_DC  = 0.035;  // Hz  passa-alto: toglie bias e inclinazione lenta
const K_ACC = 0.020;  // correzione accelerometro sulla gravita' (filtro complementare)

let G={x:0,y:0,z:-9.81}, gReady=false;
let lpLong=0,lpLat=0,lpYaw=0;        // passa-basso
let dcLong=0,dcLat=0;                // stima DC per il passa-alto
let bpLong=0,bpLat=0,bpYaw=0;        // uscita passa-banda
let hiE=0, loE=0;                    // energia banda alta (mano) / bassa (veicolo)
let tiltE=0;                         // rotazione su assi orizzontali = polso
let conf=0;                          // confidenza "e' il veicolo"
let raw={x:0,y:0,z:0};
let lastT=0,lastEv=0,evN=0,hz=0,hzT=0;

let dispX=0,dispY=0,velX=0,velY=0,flowX=0,flowY=0,smX=0,smY=0,energy=0;
let sim=false,invert=1,gain=1,filtOn=true;
const GAINS=[1,1.7,2.6];let gi=0;
const SK=new Array(96).fill(0);

const clamp=(v,m)=>v<-m?-m:v>m?m:v;
const d3=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const lpA=(dt,fc)=>dt/(dt+1/(2*Math.PI*fc));

function onMotion(e){
  const ag=e.accelerationIncludingGravity;
  if(!ag||ag.x==null)return;
  const now=performance.now();
  let dt=lastT?(now-lastT)/1000:0.016;
  if(dt<=0||dt>0.2)dt=0.016;
  lastT=now;lastEv=now;evN++;raw=ag;

  /* --- giroscopio, rad/s, frame dispositivo --- */
  const rr=e.rotationRate||{};
  const w={x:(rr.beta||0)*RAD, y:(rr.gamma||0)*RAD, z:(rr.alpha||0)*RAD};

  /* --- 1. GRAVITA' via FILTRO COMPLEMENTARE ---
     propaga con il giroscopio (dg/dt = -w x g), corregge piano con l'accelerometro.
     Elimina il "sanguinamento" della gravita' quando ruoti il polso.       */
  if(!gReady){G={x:ag.x,y:ag.y,z:ag.z};gReady=true;}
  else{
    const cx=w.y*G.z-w.z*G.y, cy=w.z*G.x-w.x*G.z, cz=w.x*G.y-w.y*G.x;
    G.x-=cx*dt; G.y-=cy*dt; G.z-=cz*dt;
    const am=Math.hypot(ag.x,ag.y,ag.z)||1;
    const trust=K_ACC*(1-Math.min(1,Math.abs(am-9.81)/6));  // sfiducia se accelera forte
    G.x+=(ag.x-G.x)*trust; G.y+=(ag.y-G.y)*trust; G.z+=(ag.z-G.z)*trust;
  }
  const gm=Math.hypot(G.x,G.y,G.z)||1;
  const gu={x:G.x/gm,y:G.y/gm,z:G.z/gm};

  /* --- 2. accelerazione lineare --- */
  const lin={x:ag.x-G.x,y:ag.y-G.y,z:ag.z-G.z};

  /* --- 3. assi orizzontali stabili --- */
  const vc=d3(lin,gu);
  const aH={x:lin.x-vc*gu.x,y:lin.y-vc*gu.y,z:lin.z-vc*gu.z};
  let ex={x:1-gu.x*gu.x,y:-gu.x*gu.y,z:-gu.x*gu.z};
  const em=Math.hypot(ex.x,ex.y,ex.z)||1;ex={x:ex.x/em,y:ex.y/em,z:ex.z/em};
  const el={x:gu.y*ex.z-gu.z*ex.y,y:gu.z*ex.x-gu.x*ex.z,z:gu.x*ex.y-gu.y*ex.x};
  const rLat=d3(aH,ex), rLong=d3(aH,el);

  /* --- 4. IMBARDATA = curva. Proiezione del giroscopio sulla verticale --- */
  const rYaw=d3(w,gu)/RAD;                 // deg/s attorno all'asse verticale
  const wTilt=Math.hypot(w.x,w.y,w.z)/RAD - Math.abs(rYaw); // resto = polso

  /* --- 5. PASSA-BANDA 0.035–0.75 Hz --- */
  const aL=lpA(dt,F_VEH), aD=lpA(dt,F_DC);
  lpLong+=(rLong-lpLong)*aL; lpLat+=(rLat-lpLat)*aL; lpYaw+=(rYaw-lpYaw)*aL;
  dcLong+=(lpLong-dcLong)*aD; dcLat+=(lpLat-dcLat)*aD;
  const oL=lpLong-dcLong, oT=lpLat-dcLat;

  /* --- 6. energie di banda: prova che il filtro lavora --- */
  const hf=Math.hypot(rLong-lpLong, rLat-lpLat);   // residuo alta frequenza = mano
  const lf=Math.hypot(oL,oT);                       // banda veicolo
  const aE=lpA(dt,1.1);
  hiE+=(hf-hiE)*aE; loE+=(lf-loE)*aE;
  tiltE+=(Math.max(0,wTilt)-tiltE)*aE;

  /* --- 7. confidenza veicolo --- */
  const ratio=loE/(loE+hiE*0.55+0.02);
  const tiltPen=1/(1+tiltE/38);
  conf+=(Math.max(0,Math.min(1,ratio*tiltPen*1.15))-conf)*aE;

  if(filtOn){bpLong=oL; bpLat=oT; bpYaw=lpYaw;}
  else{bpLong=rLong; bpLat=rLat; bpYaw=rYaw;}

  SK.push(Math.hypot(lin.x,lin.y,lin.z));SK.shift();
  drive();
}

function drive(){
  const sc=Math.min(H,900),sw=Math.min(W,520);
  const g=gain*invert*(filtOn?(0.35+0.65*conf):1);   // scala con la confidenza
  dispY=clamp(bpLong*0.155*sc*g,H*0.27);
  dispX=clamp(-(bpYaw*0.011+bpLat*0.10)*sw*g,W*0.27);
  velY=velY*0.905+bpLong*1.7*g;
  velX=velX*0.905-(bpYaw*0.10+bpLat*1.0)*g;
  energy=Math.min(1,(Math.abs(bpLong)+Math.abs(bpLat)+Math.abs(bpYaw)*0.05)/2.4);
}

/* ============ RENDER: nessuna funzione del tempo ============ */
function loop(){
  const now=performance.now();
  if(now-hzT>500){hz=Math.round(evN/((now-hzT)/1000));evN=0;hzT=now;}
  const alive=sim||(now-lastEv<700);
  if(!alive){dispX*=.88;dispY*=.88;velX*=.88;velY*=.88;energy*=.88;}

  flowY=(flowY+velY)*0.986; flowX=(flowX+velX)*0.986;
  flowY=clamp(flowY,H*0.42); flowX=clamp(flowX,W*0.42);
  const tX=dispX+flowX*0.5, tY=dispY+flowY*0.5;
  smX+=(tX-smX)*0.19; smY+=(tY-smY)*0.19;

  ctx.clearRect(0,0,W,H);
  const R=3.0+energy*6.2;
  ctx.globalAlpha=1;
  for(const tr of tracks){
    const dx=tr.v?smX*0.2:smX, dy=tr.v?smY:smY*0.2;
    const rr=R*tr.w, s=rr*2.9;
    ctx.globalAlpha=(0.30+0.62*energy)*tr.w;
    for(const p of tr.p){
      const x=p.x+dx, y=p.y+dy;
      if(y<-s||y>H+s||x<-s||x>W+s)continue;
      ctx.drawImage(SP,x-s/2,y-s/2,s,s);
    }
  }
  ctx.globalAlpha=1;
  hud(alive);
  requestAnimationFrame(loop);
}

/* ============ HUD ============ */
const sk=$('spark'),sx=sk.getContext('2d');
function hud(alive){
  const led=$('led');
  if(alive){led.classList.add('ok');
    $('st').textContent=sim?'SIMULAZIONE':(conf>0.55?'VEICOLO':'SENSORI LIVE');}
  else{led.classList.remove('ok');$('st').textContent='NESSUN DATO';}
  $('hz').textContent=(alive&&!sim)?hz+'Hz':'';

  bip($('bLong'),bpLong/3.2); bip($('bLat'),(bpLat+bpYaw*0.05)/3.2);
  uni($('bVeh'),conf); uni($('bHand'),Math.min(1,hiE/2.2));

  $('nums').textContent=
    'raw '+n(raw.x)+n(raw.y)+n(raw.z)+'\n'+
    'veic'+n(bpLong)+n(bpLat)+n(bpYaw)+'\n'+
    'lo '+loE.toFixed(2)+'  hi '+hiE.toFixed(2)+'  c '+conf.toFixed(2);

  const w=sk.width,h=sk.height;
  sx.clearRect(0,0,w,h);
  sx.strokeStyle='rgba(255,255,255,.06)';sx.lineWidth=1;
  sx.beginPath();sx.moveTo(0,h/2);sx.lineTo(w,h/2);sx.stroke();
  sx.beginPath();sx.lineWidth=2.2;sx.lineJoin='round';
  sx.strokeStyle=alive?'rgba(10,132,255,.95)':'rgba(70,76,84,.9)';
  for(let i=0;i<SK.length;i++){
    const v=Math.min(1,SK[i]/6), X=i/(SK.length-1)*w, Y=h-3-v*(h-8);
    i?sx.lineTo(X,Y):sx.moveTo(X,Y);
  }
  sx.stroke();
}
function n(v){return (v==null?0:v).toFixed(2).padStart(7)}
function bip(el,v){v=clamp(v||0,1);const w=Math.abs(v)*50;
  el.style.width=w+'%';el.style.left=v>=0?'50%':(50-w)+'%';}
function uni(el,v){el.style.width=(Math.max(0,Math.min(1,v||0))*100)+'%';}

/* ============ AVVIO ============ */
function reveal(){
  $('gate').classList.add('out');
  setTimeout(()=>{$('gate').style.display='none';stopGate&&stopGate();},520);
  $('hud').classList.add('on');$('foot').classList.add('on');
  hzT=performance.now();loop();
}
function fail(m){$('gate').style.display='flex';$('gate').classList.remove('out');
  $('warn').textContent=m;$('simu').style.display='inline-block';}

$('go').addEventListener('click',function(){
  const D=window.DeviceMotionEvent;
  if(D&&typeof D.requestPermission==='function'){
    D.requestPermission().then(r=>{
      if(r==='granted'){addEventListener('devicemotion',onMotion);reveal();wake();}
      else fail('Permesso negato. Impostazioni → Safari → Avanzate → "Accesso a movimento e orientamento" → ON, poi ricarica.');
    }).catch(()=>fail('Richiesta permesso fallita. Serve HTTPS in Safari, non dentro anteprime o iframe.'));
    return;}
  if(D){addEventListener('devicemotion',onMotion);reveal();wake();
    setTimeout(()=>{if(!lastEv)fail('Nessun evento dai sensori su questo dispositivo.');},1800);return;}
  fail('DeviceMotion non supportato da questo browser.');
});
function wake(){try{if('wakeLock' in navigator)navigator.wakeLock.request('screen').catch(()=>{});}catch(_){}}

$('simu').addEventListener('click',()=>{
  sim=true;reveal();
  (function s(){const q=performance.now()/1000;
    bpLong=Math.sin(q*0.9)*1.9;bpLat=Math.sin(q*0.4)*1.2;bpYaw=Math.sin(q*0.55)*17;
    conf=0.85;loE=1.4;hiE=0.2;
    SK.push(Math.abs(bpLong)+Math.abs(bpLat));SK.shift();
    drive();requestAnimationFrame(s);})();
});

/* ============ CONTROLLI ============ */
$('tHud').addEventListener('click',function(){const on=$('hud').classList.toggle('on');
  this.classList.toggle('act',on);});
$('tInv').addEventListener('click',function(){invert*=-1;this.textContent=invert>0?'VERSO +':'VERSO −';});
